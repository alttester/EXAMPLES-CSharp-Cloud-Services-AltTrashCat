name: BrowserStack TrashCat
on:
  push:

env:
  BROWSERSTACK_USERNAME: ${{secrets.BROWSERSTACK_USERNAME}}
  BROWSERSTACK_ACCESS_KEY: ${{secrets.BROWSERSTACK_ACCESS_KEY}}
  BROWSERSTACK_APP_ID_SDK_201: ${{secrets.BROWSERSTACK_APP_ID_SDK_201}}

jobs:
  csharp-tests-job:
    name: "CSharp tests on BrowserStack"
    runs-on: ["ubuntu-latest"]
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: "7.0"

      - name: Restore dependencies
        run: dotnet restore

      - name: Download BrowserStackLocal
        run: |
          wget https://www.browserstack.com/browserstack-local/BrowserStackLocal-linux-x64.zip
          unzip BrowserStackLocal-linux-x64.zip
          chmod +x BrowserStackLocal
          mv BrowserStackLocal /usr/local/bin/

      - name: "Running tests on BrowserStack"
        run: dotnet test --filter "StartPageTests"
