name: BrowserStack TrashCat
on:
  push:

env:
  BROWSERSTACK_USERNAME: ${{secrets.BROWSERSTACK_USERNAME}}
  BROWSERSTACK_ACCESS_KEY: ${{secrets.BROWSERSTACK_ACCESS_KEY}}
  BROWSERSTACK_APP_ID_SDK_202: ${{secrets.BROWSERSTACK_APP_ID_SDK_202}}

jobs:
  csharp-tests-job:
    name: "CSharp tests on BrowserStack"
    runs-on: ["ubuntu-latest"]
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: "7.0"

      - name: Restore dependencies
        run: dotnet restore

      - name: Download BrowserStackLocal2
        run: |
          wget https://www.browserstack.com/browserstack-local/BrowserStackLocal-linux-x64.zip
          unzip BrowserStackLocal-linux-x64.zip
          chmod +x BrowserStackLocal
          mv BrowserStackLocal /usr/local/bin/

      - name: Verify BrowserStackLocal binary
        run: |
          ls -l /usr/local/bin/BrowserStackLocal
          /usr/local/bin/BrowserStackLocal --version || true

      - name: Validate BrowserStack app capability
        run: |
          APP_ID=$(printf "%s" "$BROWSERSTACK_APP_ID_SDK_202" | tr -d '\r' | xargs)

          if [ -z "$APP_ID" ]; then
            echo "BROWSERSTACK_APP_ID_SDK_202 is empty"
            exit 1
          fi

          echo "APP_ID length: ${#APP_ID}"
          echo "APP_ID prefix: ${APP_ID:0:5}"

          RESP=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            "https://api-cloud.browserstack.com/app-automate/recent_apps")
          echo "recent_apps response: $RESP"

          if [[ "$APP_ID" == bs://* ]]; then
            if echo "$RESP" | grep -qF "$APP_ID"; then
              echo "app_url confirmed in this account"
              exit 0
            fi
            echo "ERROR: app_url not found in this account's recent_apps. Check that BROWSERSTACK_USERNAME/ACCESS_KEY secrets match the account that uploaded the app."
            exit 1
          fi

          if echo "$RESP" | grep -qF "\"custom_id\":\"$APP_ID\""; then
            echo "Found custom_id: $APP_ID"
          else
            echo "custom_id '$APP_ID' not found in this BrowserStack account"
            exit 1
          fi

      - name: "Running tests on BrowserStack"
        env:
          BROWSERSTACK_LOCAL_BINARY: /usr/local/bin/BrowserStackLocal
        run: dotnet test --filter "StartPageTests"
